name: Build Godot 3.5.3 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-11-jdk

      - name: Download Godot 3.5.3
        run: |
          wget -O godot.zip \
            https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip -o godot.zip
          chmod +x Godot_v3.5.3-stable_linux_headless.64

      - name: Download Android export templates
        run: |
          mkdir -p ~/.local/share/godot/templates/3.5.3.stable
          wget -O templates.tpz \
            https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
          unzip -o templates.tpz -d templates
          cp -r templates/templates/* \
            ~/.local/share/godot/templates/3.5.3.stable/

      - name: Import Godot project assets
        run: |
          ./Godot_v3.5.3-stable_linux_headless.64 \
            --path . \
            --editor \
            --quit

      - name: Configure Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Android-APK
          path: game.apk