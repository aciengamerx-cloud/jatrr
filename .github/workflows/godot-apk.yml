name: Build Godot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-11-jdk

      - name: Set Java environment
        run: |
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV

      - name: Download Godot 3.5.3
        run: |
          wget -q --show-progress \
            https://downloads.tuxfamily.org/godotengine/3.5.3/Godot_v3.5.3-stable_linux_headless.64.zip \
            -O godot.zip
          unzip -o godot.zip
          chmod +x Godot_v3.5.3-stable_linux_headless.64

      - name: Download Android export templates
        run: |
          wget -q --show-progress \
            https://downloads.tuxfamily.org/godotengine/3.5.3/Godot_v3.5.3-stable_export_templates.tpz \
            -O templates.tpz

          mkdir -p ~/.local/share/godot/templates/3.5.3.stable
          unzip -o templates.tpz -d /tmp/godot-templates

          cp -r /tmp/godot-templates/templates/* \
            ~/.local/share/godot/templates/3.5.3.stable/

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-32" "build-tools;32.0.0"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Check project
        run: |
          ./Godot_v3.5.3-stable_linux_headless.64 \
            --path . \
            --editor \
            --headless \
            --quit

      - name: Export APK
        run: |
          mkdir -p build

          ./Godot_v3.5.3-stable_linux_headless.64 \
            --path . \
            --export-debug "Android" \
            build/game.apk

          test -s build/game.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Godot-APK
          path: build/game.apk
          if-no-files-found: error